    rationale: 'User, verbatim (2026-07-16): "One thing I would like is to track each
      step of work so that when I run out of tokens at 11pm I do not need to leave
      my pc on all night to avoid losing my progress point / learning." Becomes UC13
      with a zero-loss NFR.'
