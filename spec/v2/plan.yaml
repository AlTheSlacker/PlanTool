  - id: 34
    plan_id: 1
    plan_version_added: 1
    text: 'Brief sizing carries no token quotas: how much plan content goes into a
      sub-task brief is a task-specific judgment by the composing LLM. Relevance is
      defined structurally by the plan''s link graph (rows reachable from the sub-task''s
      contracts/components are candidates), and the LLM''s selection is made auditable
      — omitted candidate rows are recorded — rather than caged by numbers.'
    rationale: 'User, verbatim (2026-07-16): "I think this is almost impossible to
      put numbers to, I never have any idea how many tokens an operation is going
      to take, and I''m pretty sure neither do you. Talking about 40% also seems meaningless
      (a massive project with 20 code sessions vs a tiny project with 3 - what is
      40%, why is it significant?). This needs to be a task specific judgement by
      the LLM." The link-graph candidacy + auditable-omission mechanism is the engineer''s
      answer to making that judgment verifiable without quotas.'
    alternatives: '[{"alternative": "Fixed absolute token budget per brief", "rejected_because":
      "Owner: token counts are unknowable in advance and meaningless as a quality
      bar."}, {"alternative": "Percentage of engine context window (e.g. 40%)", "rejected_because":
      "Owner: percentage is meaningless across project scales \u2014 ''what is 40%,
      why is it significant?''"}]'
