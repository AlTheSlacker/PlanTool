  - id: 8
    plan_id: 1
    plan_version_added: 1
    text: 'Problem statement: Large, complex solo projects fail late and expensively
      due to (a) poorly defined dependencies, (b) research-level technology embedded
      unnoticed in the plan and discovered unsolvable only at a milestone build after
      substantial sunk work, and (c) LLM forgetfulness, false assumptions, and inaccurate
      assessments across sessions. Root cause accepted by the user: insufficient upfront
      planning and failure-point analysis. The intent is to shift effort heavily toward
      planning and away from failed implementations.'
    rationale: 'User''s own account of why now: "I often develop large, complex projects
      that are prone to failure due to poorly defined dependencies, research level
      tech that then cannot be resolved at a milestone build... LLM forgetfullness/false
      assumptions/inaccurate assessments... I want to spend far more time planning
      and less time with failed implementations."'
