  findings:
  - id: 1
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'The writer-lock contract set has no release operation. contracts:3 acquires,
      contracts:4 heartbeats — nothing ever releases. A session that finishes cleanly
      leaves its lease held until 10-minute staleness expires (requirements:63). Consequence
      for the plan''s own stage-7 workflow (use_cases:8): the author session is alive-but-idle
      while a fresh red-team session must WRITE findings; the red team is locked out
      until staleness, and an author session that heartbeats while waiting locks it
      out forever. Same deadlock for a code engine reporting status while a planning
      session idles (dep_failure_modes:6 scenario in reverse). A release_writer_lock
      (and/or an explicit handoff) contract is a missing row.'
    disposition: fixed
    disposition_rationale: 'Missing release operation added: contracts:54 (release_writer_lock
      on storage-engine) frees the lock immediately on clean finish instead of waiting
      out 10-minute staleness; LeaseLost on release is idempotent-safe. The author-idle/red-team-locked-out
      deadlock in use_cases:8 dissolves — a finishing session releases, and an idle-but-alive
      session no longer starves writers.'
    links: '["contracts:3", "contracts:4", "requirements:63", "decisions:44", "use_cases:8",
      "contracts:54"]'
    created_at: '2026-07-17 11:40:45'
  - id: 2
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'The heartbeat mechanism is unimplementable as specified. dep_failure_modes:12
      declares the tool "a passive, durable callee" — it executes only when a tool
      call arrives — yet requirements:64 demands the original holder "stops writing
      immediately" when its lease is claimed, and contracts:4 assumes something periodically
      calls heartbeat_lock. No row says WHO fires the heartbeat or WHEN. In the normal
      interactive pattern (owner thinking/typing for 10+ minutes between tool calls,
      the exact scenario decisions:41 describes), a passive callee cannot heartbeat,
      so a live session loses its lock by design — the spike (spikes:1) already observed
      live-session lock theft at scaled thresholds. Either the surface heartbeats
      on a background thread (contradicting ''passive callee'', and dying with host
      suspend/sleep), or lock loss during normal use is accepted; neither is recorded.
      Also unspecified: the check-lease-then-commit race — ''stops immediately'' is
      only achievable if lease validity is verified atomically inside the same transaction
      as each write, which no contract states.'
    disposition: fixed
    disposition_rationale: 'Heartbeat replaced by a passive lease model: renewal piggybacks
      on every tool call (contracts:53) and enforcement moved to the write boundary
      — every write validates the lease inside the same transaction that applies it
      (requirements:68). ''Stops writing immediately'' now means ''no further write
      can land'', implementable by a passive callee with no background thread; the
      check-lease-then-commit race is closed by the same-transaction rule.'
    links: '["requirements:64", "contracts:4", "dep_failure_modes:12", "decisions:44",
      "spikes:1", "decisions:41", "contracts:53", "requirements:68"]'
    created_at: '2026-07-17 11:40:52'
  - id: 3
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'Brief composition has a circular actor dependency. contracts:36 (next_subtask)
      returns "the ready sub-task plus its composed brief" and consumes contracts:39
      (compose_brief), but compose_brief requires a BriefSelection argument produced
      by "the composing LLM" (decisions:52). The tool has no LLM access (non-goal
      decisions:12), so the selection must come from the caller — but the caller of
      next_subtask is the code engine, which at that moment has never seen the plan
      and cannot select from a closure it hasn''t read. No row defines the actual
      call sequence: who receives the candidate closure, who makes the selection,
      and how next_subtask can return an already-composed brief in one call. As specified,
      the product''s central capability (decisions:32 calls it "highly complex" and
      core) cannot be executed from these contracts.'
    disposition: fixed
    disposition_rationale: 'Call sequence now defined (decisions:60): next_subtask
      (contracts:55) returns candidates + closure, the planning session''s LLM makes
      the BriefSelection, compose_brief (contracts:56) is the second call. No actor
      is asked to select from a plan it has not read.'
    links: '["contracts:36", "contracts:39", "requirements:36", "decisions:52", "decisions:12",
      "decisions:32", "decisions:60", "contracts:55", "contracts:56"]'
    created_at: '2026-07-17 11:40:56'
  - id: 4
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'The successor''s planning methodology itself has no rows. The plan specifies
      machinery to SERVE stage scripts (contracts:18), the mandate (contracts:17),
      gap clusters (contracts:19), and mechanical gates (contracts:22) — but nowhere
      defines the successor''s stage list, the content of any stage script or the
      mandate, the per-stage mechanical gate criteria (beyond the two elicit cross-checks
      in requirements:17), or the gap-derivation rules (what deficiency types the
      gap-engine detects). These are the product''s core IP and its hardest design
      problem. Against goal decisions:14 (execution sufficiency: zero sub-tasks blocked
      by missing plan information), the executor building guidance/gap-engine/gate-engine
      would have to invent the entire methodology at build time — the exact milestone-time
      re-planning failure this tool exists to prevent.'
    disposition: fixed
    disposition_rationale: 'Methodology content now has owning rows: decisions:61
      vendors PlanTool rev-2 methodology as versioned content assets with a content-revision
      stamp; requirements:71 makes shipping the assets and the revision-migration
      path a requirement. The content-revision stamp also pre-answers the fossilization
      premortem.'
    links: '["components:4", "components:5", "components:6", "contracts:18", "contracts:22",
      "contracts:19", "requirements:17", "requirements:20", "decisions:14", "decisions:61",
      "requirements:71"]'
    created_at: '2026-07-17 11:41:06'
  - id: 5
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'Revision rollback contradicts the write-once supersession model. adjudicate_repercussion
      (contracts:44) applies changes immediately during the walkthrough ("rows updated
      with provenance, affected gates re-run, affected briefs regenerated"), yet abandon_revision
      (contracts:46, requirements:53) promises the plan "restored cleanly to its pre-change
      version". Undoing an applied supersession is impossible under the plan''s own
      rules: superseded rows are frozen history (sm_cells:39-42), superseded_by stamps
      are write-once (requirements:61, decisions:42), and briefs are immutable. Restoring
      the pre-change PlanVersion snapshot would work — except requirements:53 also
      demands the analysis record be PRESERVED, and it lives in the same store being
      restored. The plan needs either deferred application (nothing mutates until
      apply_revision) or a defined selective-restore semantics; as written the three
      rules are jointly unsatisfiable.'
    disposition: fixed
    disposition_rationale: 'Deferred application: contracts:57 stages adjudications
      and only apply_revision mutates rows; requirements:72 rewords abandon as discarding
      staged changes, with the analysis record stored outside the plan-row snapshot.
      The three previously jointly-unsatisfiable rules are now consistent.'
    links: '["requirements:53", "contracts:44", "contracts:46", "requirements:61",
      "decisions:42", "state_machines:2", "contracts:57", "requirements:72"]'
    created_at: '2026-07-17 11:41:12'
  - id: 6
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'The Plan state machine globally freezes implementation during revision,
      contradicting the freeze-only-affected policy. sm_cells:20 makes start_implementation
      impossible while revising ("affected briefs are frozen during revision") and
      sm_cells:24 declares "implementation is paused during revision" — but requirements:54
      and uc_extensions:41 freeze only AFFECTED briefs "until the impact analysis
      completes", implying unaffected sub-tasks keep flowing. Concretely: plan is
      implementing, owner opens a revision touching one component, and next_subtask
      (contracts:36) for a completely unrelated ready sub-task now fails PlanNotFinalized
      because the plan sits in ''revising''. For long walkthroughs (uc_extensions:44
      anticipates multi-session ones) the entire build stalls. Either the state machine
      needs a concurrent implementing+revising composite, or requirements:54''s affected-only
      wording is wrong; the two rows currently disagree.'
    disposition: fixed
    disposition_rationale: 'Owner chose affected-only freeze (decisions:62): sm_cells:186/sm_cells:187
      make start_implementation/complete_implementation self-transitions in ''revising'',
      so unaffected sub-tasks keep flowing and only the impact set freezes (requirements:54).
      The state machine and the requirement now agree.'
    links: '["sm_cells:20", "sm_cells:24", "requirements:54", "uc_extensions:41",
      "contracts:36", "state_machines:1", "decisions:62", "sm_cells:186", "sm_cells:187"]'
    created_at: '2026-07-17 11:41:16'
  - id: 7
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'Gamed cannot_fail: contracts:16 (find_cycles) claims "cannot fail: pure
      computation over edges already validated at write time" — but it must READ those
      edges from the store, exactly like its siblings closure (contracts:14) and impact
      (contracts:15), both of which carry DanglingRef errors routing to the integrity
      check, and every other read path in the system carries StorageUnavailable/PlanUnreadable.
      A corrupt or unavailable store makes find_cycles fail; the cannot_fail assertion
      is convenience, not impossibility — the precise escape class the stage-7 standing
      targets name.'
    disposition: fixed
    disposition_rationale: contracts:58 drops cannot_fail and declares DanglingRef
      + StorageUnavailable with the same routing semantics as its siblings contracts:14/15.
    links: '["contracts:16", "contracts:14", "contracts:15", "contracts:58"]'
    created_at: '2026-07-17 11:41:26'
  - id: 8
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'Spike 1''s design consequences were recorded as a decision but never propagated
      into the requirements and contracts an executor will actually build from. decisions:58
      mandates a hardened lock protocol for network mounts (heartbeat retry-on-sharing-violation,
      reader access that never holds the lock file open, staleness >> heartbeat interval)
      plus a resume-time SMB durability warning — yet requirements:63/64 and contracts:3/4
      are unchanged and mention none of it, and no requirement exists for the resume-time
      warning at all. A brief composed for storage-engine or session-service could
      satisfy 100% candidate accounting while omitting decisions:58 if the composing
      LLM judges a ''decision about a spike'' peripheral. Separately, decisions:58''s
      claim that the production 10-min-vs-30-s ratio "satisfies this" is extrapolation,
      not observation: even WITH retry the spike''s heartbeat age reached 5.45s of
      a 6s threshold (91%); nothing shows sharing-violation bursts stay bounded at
      minutes-long scale.'
    disposition: spiked
    disposition_rationale: 'd58''s hardening now lives in the rows an executor builds
      from: requirements:67/requirements:68 and contracts:52/contracts:53 carry sharing-violation
      retry, reader-never-holds-open, and the write-boundary lease check; the missing
      resume-time SMB warning is requirements:69. The remaining unverified claim —
      bursts stay bounded at production cadence — is recorded as assumed(world) decisions:59
      and will be settled by spikes:2 (registered, method in row; execution pending).'
    links: '["decisions:58", "requirements:63", "requirements:64", "contracts:3",
      "contracts:4", "spikes:1", "spikes:2", "requirements:67", "requirements:68",
      "contracts:52", "contracts:53", "requirements:69", "decisions:59"]'
    created_at: '2026-07-17 11:41:32'
  - id: 9
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: Contract verification of delivered work is asserted but owned by nobody.
      uc_extensions:36 says deviation from contract is caught by "verification against
      the contract", and dep_failure_modes:10 says "nothing counts as done until the
      contract verification passes" — but no component, contract, or requirement defines
      who runs that verification, what it checks, or what evidence gates the in_progress→done
      transition. contracts:37 (report_status) accepts "completion evidence" as a
      free string and applies the transition. As specified, 'done' means 'the engine
      said so' — the honor system UC9's failure handling explicitly claims not to
      be.
    disposition: fixed
    disposition_rationale: 'Verification now has an owner: contracts:59 (task-graph)
      checks delivered evidence against every contract in the sub-task''s scope and
      its passing verdict is the sole enabler of in_progress->done; contracts:60 refuses
      ''done'' without it (VerificationMissing) and demotes the free-string detail
      to notes.'
    links: '["uc_extensions:36", "dep_failure_modes:10", "contracts:37", "use_cases:9",
      "contracts:59", "contracts:60"]'
    created_at: '2026-07-17 11:41:36'
  - id: 10
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: Workspace-drift detection has no mechanism. requirements:59 and uc_extensions:49
      require resume to "flag the drift between plan assumptions and current workspace
      state", and contracts:47 (plan_status) advertises "workspace-drift flags" —
      but no entity stores a workspace fingerprint, no row defines which plan assumptions
      are drift-checkable, and no contract captures workspace state at any earlier
      moment to compare against. What is compared with what, and when the baseline
      is taken, is nowhere in the plan; the executor cannot build this flag from the
      rows provided.
    disposition: fixed
    disposition_rationale: 'Baseline defined: requirements:73 captures a minimal workspace
      fingerprint at finalization and each brief issue (no new entity — it rides on
      the plan version/brief); contracts:61 computes drift flags by comparing that
      stored fingerprint against the current workspace.'
    links: '["requirements:59", "uc_extensions:49", "contracts:47", "requirements:73",
      "contracts:61"]'
    created_at: '2026-07-17 11:41:45'
  - id: 11
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: Sub-task granularity is undefined. requirements:34 and contracts:35 derive
      the task graph "from components, contracts, and dependencies" — but no row says
      what one SubTask node IS (a component? a contract? a contract-plus-its-tests?),
      what the derivation algorithm produces, or how dependency edges between sub-tasks
      map from contract_deps. entities:9 defines the SubTask lifecycle in 36 cells
      yet the entity's unit of granularity — the single most consequential input to
      brief sizing (decisions:32/34) — is unspecified. Two implementers would derive
      incompatible graphs from the same plan, and the split_subtask remedy (contracts:40)
      presumes a divisible unit whose composition rules were never stated.
    disposition: fixed
    disposition_rationale: 'decisions:63: one SubTask = one contract implementation
      unit; edges map from contract_deps; split_subtask divides along the contract''s
      param/error surface. Derivation is now deterministic.'
    links: '["requirements:34", "contracts:35", "entities:9", "contracts:40", "decisions:32",
      "decisions:63"]'
    created_at: '2026-07-17 11:41:51'
  - id: 12
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'Zero-loss checkpointing collides with single-writer rejection. requirements:56/60
      guarantee every completed work unit is durably recorded "at that moment" with
      a loss target of 0 — but requirements:63 makes any second session''s write bounce
      with a visible error while another holds the lock, for up to 10 minutes (longer,
      since nothing releases the lock — see the missing-release finding). Concrete
      scenario: the code engine finishes a sub-task and reports; the planning session
      holds the lock; the engine''s session dies (token exhaustion, the exact decisions:41
      scenario) before the lock frees; the completion and its learnings are gone,
      violating the Planguage target of 0. The plan needs either a write-queue/park
      mechanism for checkpoint-class writes or an explicit carve-out; currently the
      two requirements are jointly unsatisfiable under multi-session operation the
      plan itself schedules (planning + engine + red-team sessions).'
    disposition: fixed
    disposition_rationale: 'New requirement requirements:70: checkpoint-class writes
      rejected under lock contention park in a session-local durable spill journal
      and reconcile automatically on the next lock acquisition — the Planguage loss
      target of 0 survives a session dying before the lock frees.'
    links: '["requirements:60", "requirements:56", "requirements:63", "decisions:41",
      "dep_failure_modes:6", "requirements:70"]'
    created_at: '2026-07-17 11:41:55'
  - id: 13
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'Requirements 1-4 carry malformed canonical text: doubled boilerplate ("The
      system shall The system shall run on Windows...") and doubled terminal punctuation,
      with requirements:4 reading "...the system shall The system shall flag it...".
      In a product whose core mechanism is serving stored row text verbatim into scoped
      briefs (requirements:36), garbled canonical text propagates into every brief
      that cites these rows — including the foundational portability and MCP-compliance
      constraints that bind nearly every component. These rows should be superseded
      with clean text.'
    disposition: fixed
    disposition_rationale: requirements:1-4 superseded by requirements:74, requirements:75,
      requirements:76, requirements:77 with the renderer boilerplate and doubled punctuation
      stripped; briefs citing these rows now serve clean canonical text.
    links: '["requirements:1", "requirements:2", "requirements:3", "requirements:4",
      "requirements:74", "requirements:75", "requirements:76", "requirements:77"]'
    created_at: '2026-07-17 11:42:04'
  - id: 14
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: 'Provenance lineage on the decisions:6 chain never closed: decisions:6 is
      STILL an active assumed/intent row (provenance ''assumed'', superseded_by null,
      verified via get_rows include_inactive) at stage 7, while decisions:25/26/27
      are three near-identical ''decided'' rows all quoting the same user answer;
      decisions:27''s rationale says "Supersedes and upgrades the intent-assumption
      decisions:6" but its supersedes pointer is null — the supersession exists only
      as prose. decisions:26 and 27 are pure duplicates of 25 adding nothing. This
      is documented prototype friction (decisions:28a), but the residue is a live
      plan where an external reader''s single liveness check (requirements:61) reports
      an unconfirmed assumption AND its three confirmations as simultaneously live
      intent. The successor plan should not ship its own provenance discipline violated
      in its own store: 6 needs confirming or superseding with real lineage, 26/27
      retiring.'
    disposition: fixed
    disposition_rationale: decisions:6 upgraded assumed(intent)->decided via confirm_assumption
      quoting the owner's 2026-07-17 answer, with decisions:25's original verbatim
      condition (behavior-derived requirements must cite the observed friction) folded
      into the provenance note; duplicate confirmations decisions:25/26/27 retired
      with owner approval. A liveness check now reports one decided row, no dangling
      confirmations.
    links: '["decisions:6", "decisions:25", "decisions:26", "decisions:27", "decisions:28",
      "requirements:61"]'
    created_at: '2026-07-17 11:42:10'
  - id: 15
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: Plan 'tier' is recorded but semantically undefined. uc_steps:2 and requirements:8
      record a tier at initialization, and entities:1 carries it as core Plan state
      — but no row enumerates the valid tiers or defines a single behavioral difference
      between them (do gates, stages, or gap rules change per tier?). Either tier
      drives behavior (in which case the behavior matrix is a missing, load-bearing
      set of rows) or it is inert metadata (in which case requiring it at init is
      unjustified ceremony). uc_extensions:1 even makes the agent stop and ask the
      owner for tier before initializing — blocking on a value the plan gives no meaning.
    disposition: fixed
    disposition_rationale: 'decisions:64: tier is a forward-compat placeholder with
      exactly one v1 value (''standard''), init never blocks on it; uc_extensions:50
      drops the stop-and-ask for tier.'
    links: '["requirements:8", "uc_steps:2", "entities:1", "uc_extensions:1", "decisions:64",
      "uc_extensions:50"]'
    created_at: '2026-07-17 11:42:14'
  - id: 16
    plan_id: 1
    plan_version_added: 1
    source: redteam
    text: Gap identity across re-derivation is unspecified, and the prototype's stale-gap
      bug will recur without it. entities:3 says gaps are "computed by the gap engine
      but carrying a stored open/dismissed/resolved overlay", and contracts:20/21
      key dismiss/reopen by gap_id — but no row defines how a computed gap gets a
      stable identity when the engine re-derives after plan changes. If identity is
      positional or content-hashed, a superseded row's reworded deficiency becomes
      a 'new' gap and the recorded dismissal silently detaches — exactly the re-surfacing
      loop documented as friction in decisions:28(a) ("next_gap kept re-surfacing
      it"). The overlay needs a defined identity function (e.g., gap-type + target
      row lineage) or dismissals are not durably meaningful.
    disposition: fixed
    disposition_rationale: 'requirements:78 defines the identity function: gap-type
      + target-row lineage root, supersession-stable by construction (the same principle
      that keys PlanTool''s own gap_dismissals), so dismissals stay attached across
      re-derivation and rewording via supersede.'
    links: '["entities:3", "contracts:20", "contracts:21", "contracts:19", "decisions:28",
      "requirements:78"]'
    created_at: '2026-07-17 11:42:25'
  - id: 17
    plan_id: 1
    plan_version_added: 1
    source: premortem
    text: 'It failed because the vendored methodology fossilized: the successor shipped
      PlanTool rev-2 stage scripts, mandate, gate criteria, and gap rules as static
      content with no revision identity, so when the methodology improved there was
      no way to tell which revision a live plan was built under or to migrate it —
      plans silently mixed old-methodology rows with new-methodology gates until the
      gates'' judgments stopped meaning anything.'
    disposition: fixed
    disposition_rationale: 'Pre-answered by the finding-4 fix: decisions:61 vendors
      the methodology as versioned content assets carrying a content-revision stamp,
      and requirements:71 mandates an update path migrating a plan from one methodology
      revision to the next — revision identity and migration are exactly the two failure
      preconditions this story needs.'
    links: '["components:4", "components:5", "components:6", "decisions:61", "requirements:71"]'
    created_at: '2026-07-17 12:40:17'
  - id: 18
    plan_id: 1
    plan_version_added: 1
    source: premortem
    text: 'It failed because brief candidate accounting was gameable: compose_brief''s
      IncompleteAccounting check counts rows OFFERED, not rows NEEDED — the composing
      LLM satisfied 100% accounting by marking load-bearing-but-peripheral-looking
      rows (spike-derived lock-hardening decisions, failure-mode handling) as ''omitted:
      not relevant'', and briefs shipped without the constraints that made sub-tasks
      correct. Nobody reviewed omissions because they were formally accounted for.'
    disposition: fixed
    disposition_rationale: 'requirements:79: cited-or-explicitly-waived for every
      closure row, waiver log immutable in the brief, and waivers of decision/requirement/failure-mode
      rows surfaced to the owner at finalization and brief review — gaming the accounting
      now requires lying in a log the owner reads.'
    links: '["contracts:56", "requirements:44", "decisions:52", "requirements:79"]'
    created_at: '2026-07-17 12:40:18'
