  - id: 58
    plan_id: 1
    plan_version_added: 1
    text: 'Verified on a real SMB share (spikes:1, Synology NAS, 2026-07-17): SQLite
      atomic commits survive process-kill on network-mounted workspaces in both DELETE
      and WAL journal modes (single client machine), but the naive rename-heartbeat
      advisory lock (decisions:44) is NOT SMB-safe — the heartbeat rename intermittently
      fails with a sharing violation when a reader holds the lock file open, silently
      starving the heartbeat so a live session''s lock can be stolen. Consequence:
      local-disk workspaces are fully supported; network-mounted workspaces require
      a hardened lock protocol (heartbeat retry-on-sharing-violation, reader access
      that does not hold the lock file open, staleness threshold much greater than
      the heartbeat interval — the production 10 min vs ~30 s satisfies this) plus
      a resume-time warning that SMB carries an untested machine-crash durability
      caveat (synchronous=FULL was absorbed by client/NAS caching, commit p50 ~0 ms).'
    rationale: 'Spike 1 probe: 12/12 kill-injection rounds clean per journal mode
      per target, 20/20 O_EXCL claim races single-winner, but heartbeat PermissionError
      13 on SMB (0 on local NTFS control); observed heartbeat age reached 6.24 s past
      the 6 s scaled stale threshold while the holder lived. Full evidence: spikes/001_do_sqlite_atomic_commits_and_an_advisory/RESULTS.md.'
