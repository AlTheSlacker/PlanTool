  - id: 42
    plan_id: 1
    plan_version_added: 1
    text: 'Supersession lineage is bidirectional and machine-checkable: a superseding
      record carries a ''supersedes'' pointer set immutably at creation, and the superseded
      record receives a one-time ''superseded_by'' pointer plus timestamp at supersession.
      External readers determine live intent with a single check: superseded_by is
      null and the record is not retired. Record content remains immutable — the lineage
      stamp is a write-once lifecycle annotation, not a content edit. Applies to all
      supersedable records (Briefs, PlanRows, task-graph generations).'
    rationale: 'User (2026-07-16): "Obviously I prefer the idea to create a new updated
      record, but my concern is how does an external app examining the data know that
      the record is not live intent, should we add a field to mark entries as superseeded,
      ideally a field that points to the replacement record?" The bidirectional form
      (forward pointer too) is the engineer''s addition so lineage can be walked in
      both directions without scans.'
    alternatives: '[{"alternative": "Reverse pointer only (''supersedes'' on the new
      record), old record untouched", "rejected_because": "An external app must scan
      all newer records to learn a record is stale \u2014 exactly the user''s concern."},
      {"alternative": "Separate supersession index table, records byte-immutable",
      "rejected_because": "Liveness answer lives away from the record itself; an app
      reading a single file/row gets no signal, and index/record drift becomes a corruption
      class."}]'
    challenge: null
    significant: 0
    provenance: decided
    assumption_kind: null
