  - id: 36
    plan_id: 1
    plan_version_added: 1
    text: 'Observed prototype friction (critique baseline): the proposal-first interview
      under-pushed the owner for divergent input — the agent authored all ten use
      cases and the owner "did not feel pushed that hard to add any", so coverage
      confidence rests entirely on the agent. Successor countermeasures: (a) elicit-stage
      scripts must include mandatory divergence rounds — context-free questions, negative-space
      probes, owner-generated candidates solicited BEFORE agent drafts are shown;
      (b) elicit-stage gates must run mechanical coverage cross-checks (every actor
      appears in ≥1 use case, every goal traces to ≥1 use case). Note: the agent could
      not run those cross-checks mechanically in this session because stage-1 rows
      are unreadable cold (links decisions:28(b)).'
    rationale: 'User, verbatim (2026-07-16): "What I''m seeing from the prototype
      was you created all of the UCs and I did not feel pushed that hard to add any,
      how are you sure you have captured all of UCs? I think the discussion aspect
      needs to be expanded from the prototype." Behavior-derived per the citation
      rule in decisions:25/27; the specific countermeasures are the engineer''s mechanism,
      presented for objection.'
