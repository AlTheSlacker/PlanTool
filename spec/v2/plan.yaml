  spikes:
  - id: 1
    plan_id: 1
    plan_version_added: 1
    question: Do SQLite atomic commits and an advisory writer-lock heartbeat file
      behave correctly when the workspace sits on a network-mounted filesystem (SMB
      share), or must the tool document local-disk-only support?
    hypothesis: 'Expect partial failure: SQLite WAL mode is documented as unsafe on
      network filesystems (locking primitives unreliable over SMB/NFS), but journal=DELETE
      mode plus a separate lock file with atomic-rename claiming may survive. If WAL
      fails and DELETE-mode survives, the design consequence is a storage-engine backend
      setting; if both fail, local-disk-only is documented and resume warns on network
      paths.'
    method: 'Probe against a real SMB mount (Windows share mapped from this machine
      or a NAS path): (1) run concurrent-writer atomic-commit tests in WAL and DELETE
      journal modes, checking for corruption with PRAGMA integrity_check after kill-injection
      mid-commit; (2) exercise the advisory-lock claim protocol (create, heartbeat,
      stale-claim after silence) from two processes on the share, verifying no silent
      double-claim. No mocks — a local-disk run is the control, not the result.'
    budget: 2 hours
    verdict: refuted
    evidence_summary: 'Probe vs a real Synology SMB share (\\DISKSTATION\homes\Al\plantool_spike),
      local NTFS as control, 2026-07-17. Observed: (1) atomic commits survived 12/12
      random hard-kills in BOTH journal modes (DELETE and WAL) on SMB — integrity_check
      ok, zero orphan/short batches every round; (2) concurrent two-writer runs clean
      in both modes; (3) O_EXCL claim race: 20/20 rounds exactly one winner; (4) the
      rename-based heartbeat FAILED on SMB: os.replace onto the lock file intermittently
      raises PermissionError 13 (sharing violation) when the polling reader has it
      open — unhandled, this silently killed the holder''s heartbeat and the lock
      was stolen from a live session (observed heartbeat age 6.24s > 6s stale threshold,
      claim 0.44s before holder death); with retry, observed age still reached 5.45s/6s.
      Local disk: zero heartbeat errors. Also observed: SMB WAL commit p50 ~0ms, i.e.
      synchronous=FULL is absorbed by client/NAS caching — durability vs machine crash
      untested and presumed weaker than local disk.'
    evidence_path: spikes/001_do_sqlite_atomic_commits_and_an_advisory/RESULTS.md
    links: '["decisions:55", "decisions:44", "dep_failure_modes:2", "dependencies:1"]'
    created_at: '2026-07-16 15:00:53'
  - id: 2
    plan_id: 1
    plan_version_added: 1
    question: Do SMB sharing-violation bursts on the writer-lock file stay bounded
      well within the production staleness margin (30 s renewal vs 10 min staleness)
      under sustained reader contention, or can bursts cluster long enough to starve
      a hardened retrying renewal?
    hypothesis: With retry-on-sharing-violation and readers hammering open/read/close,
      worst-case lease age stays far below the 600 s staleness threshold (expect <
      120 s) at production renewal cadence — if bursts cluster beyond that, decisions:58's
      'production ratio satisfies this' extrapolation is refuted.
    method: 'Probe against the real Synology SMB share (\\DISKSTATION\homes\Al\plantool_spike),
      based on spikes/001 probe.py: one writer renews the lock file every 30 s via
      atomic replace with sharing-violation retry; multiple reader processes hammer
      open/read/close on the lock file continuously; run >= 30 min wall clock; record
      every renewal burst (retry count, duration) and the maximum observed lease age;
      compare against the 600 s staleness threshold. Local NTFS control run for baseline.'
    budget: 2 hours
    verdict: confirmed
    evidence_summary: '24-min run vs real Synology SMB share (plus local NTFS control),
      production protocol at real cadence: 30 s renewals via atomic replace with retry-on-sharing-violation,
      600 s staleness threshold, 3 hardened readers hammering open/read/close throughout,
      adversarial 250 ms-dwell reader added for the final 12 min. Observed: 48/48
      renewals succeeded, zero give-ups; worst renewal under dweller load took 17
      attempts / 7.94 s of continuous sharing violations; max lease age 37.94 s =
      6.3% of staleness (hypothesis bound < 120 s). Sampler channel: max unretried
      violation streak 0.44 s (sampler degraded to ~2 s/cycle by SMB latency under
      load — renewal channel is authoritative). Local control: phase A spotless (1
      attempt, <= 16 ms), worst 0.31 s with dweller. Reads saw 0.33% transient errors.
      Bursts are contention-driven and bounded ~16x under the margin.'
    evidence_path: D:\PythonProjects\LLM_Manager_Plan\spikes\002_do_smb_sharing_violation_bursts_on_the_w\RESULTS2.md
    links: '["decisions:59", "decisions:58", "contracts:53", "requirements:67"]'
    created_at: '2026-07-17 12:36:23'
  - id: 3
    plan_id: 1
    plan_version_added: 1
    question: Does a forced SMB session drop while a SQLite commit is in flight leave
      a database on the network share consistent and recoverable after reconnect —
      every interrupted transaction either fully applied or fully rolled back, and
      no acknowledged commit lost?
    hypothesis: 'Consistency holds but acknowledged-commit durability may not: SQLite''s
      journal protocol should recover an interrupted network write on reconnect (integrity_check
      ok, no partial batches), while spike 1''s untested caveat — client/NAS caching
      absorbing synchronous=FULL (commit p50 ~0 ms) — predicts that some commits acknowledged
      to the writer just before the drop may vanish. Falsified on the consistency
      side by corruption or partial batches; on the durability side by surviving-marker
      count < acknowledged-commit count.'
    method: 'Probe against the real Synology share (\\DISKSTATION\homes\Al\plantool_spike2):
      a writer loops transactional batches (20 rows + marker, synchronous=FULL) on
      a DB under the UNC path, logging each acknowledged commit; mid-commit-loop the
      orchestrator force-drops the client SMB session (net use \\DISKSTATION\... /delete
      /y), waits, reconnects, then runs PRAGMA integrity_check plus orphan/short-batch
      queries and compares surviving markers against acknowledged commits. Repeated
      rounds in journal_mode DELETE and WAL. Run strictly after spike 2 (the drop
      would sever spike 2''s writer).'
    budget: 90 minutes
    verdict: inconclusive
    evidence_summary: 'Partial execution only: 9 forced-disconnect rounds ran against
      the real Synology share (6 journal=DELETE, 3 WAL) before the owner halted network-filesystem
      spiking. Every completed round: tracked connection force-deleted mid-commit-loop,
      writer blocked in SMB I/O (no clean error — killed after 30 s), share reconnected,
      and the DB reopened; per-round integrity detail was lost to an orchestrator
      defect (results truncated to 300 chars, full JSON written only at end of a run
      that later hung on WAL-mode SMB backoff). No corruption was observed in what
      was captured, but acknowledged-commit loss — the actual question — was never
      measured. Budget/authorization ended: inconclusive.'
    evidence_path: D:\PythonProjects\LLM_Manager_Plan\spikes\003_does_a_forced_smb_session_drop_while_a_s
    links: '["decisions:58", "requirements:69", "spikes:1", "findings:8"]'
    created_at: '2026-07-17 12:44:06'
