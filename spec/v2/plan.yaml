    text: 'World-assumption: SQLite atomic commits and the advisory writer-lock heartbeat
      (decisions:44) behave correctly when the project workspace sits on a network-mounted
      filesystem (SMB/NFS) — atomicity holds, and lock claims are not silently corrupted.'
    rationale: SQLite's own documentation warns that file locking is unreliable on
      network filesystems, and the recorded failure modes (dep_failure_modes:2) explicitly
      contemplate network-drive workspaces. The storage-engine contracts assume atomic
      writes and reliable lock leases; if the assumption fails on network mounts,
      the design consequence is documenting local-disk-only support with a resume-time
      warning. To be resolved by spike against a real network mount, never by hope.
