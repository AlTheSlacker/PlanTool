  - id: 52
    plan_id: 1
    plan_version_added: 1
    text: 'Brief composition splits responsibility between tool and LLM: the tool
      computes the deterministic link-graph candidate closure; the composing LLM makes
      the task-specific selection; the contract mechanically rejects any composition
      that fails 100% candidate accounting (every candidate row either included or
      recorded-omitted) with an IncompleteAccounting error.'
    rationale: Implements decisions:34 (no token quotas; task-specific LLM judgment)
      while keeping the judgment auditable per requirements:44. The tool enforces
      honesty, not relevance. User approved 2026-07-16.
    alternatives: '[{"alternative": "Tool-side relevance ranking or numeric budgets",
      "rejected_because": "owner explicitly ruled numeric proxies (tokens, percentages)
