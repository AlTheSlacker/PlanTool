  - id: 32
    plan_id: 1
    plan_version_added: 1
    text: 'Implementation control is a core product capability, not an export feature:
      the tool decomposes the finished plan into sub-tasks and serves the code engine
      a scoped brief per sub-task — maximum relevant detail for that sub-task, never
      one massive prompt of the whole plan. The decomposition and context-slicing
      logic is acknowledged as highly complex and central to the product''s value.'
    rationale: 'User, verbatim (2026-07-16): "remember a key aspect of this too is
      how it controls implimentation, we do not want to hit the agent with one massive
      prompt, we want to give it maximum relelvant detail for the sub-task, this is
      a critical aspect of this tool and highly complex decisions are required to
      do it right." Replaces the too-simple UC9 export framing.'
    alternatives: '[{"alternative": "Plan handoff as a single full-plan export document
      the engine reads once", "rejected_because": "Explicitly rejected by the owner:
