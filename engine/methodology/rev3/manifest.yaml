# Methodology content asset — the package list, modes, and script bindings.
#
# requirements:71 — the methodology ships as versioned content assets carrying a
# content-revision stamp, with an update path that migrates a plan from one revision to
# the next. decisions:61 — the successor vendors the PlanTool rev-2 methodology rather
# than inventing one at build time; findings:4 is the red-team finding that made this
# necessary.
#
# Provenance: rev 2 (vendored verbatim from PlanTool v1, archive/v1/server/prompts/,
# 2026-07-15), carried forward at M5b with v2's vocabulary applied — `stage` retired for
# `package` throughout, and the four structural levels of D13/D14 named as the glossary
# names them.
#
# The tool surface the scripts address was v1's until 2026-07-22, when the last of it was
# replaced. What that came to, recorded because the sizes were nothing like equal:
# `next_gap` -> `next_gaps` and `get_stage_prompt` -> `get_package_script` were renames;
# `get_plan_pack("full")` became a paged `read_rows` walk, which is a change in how the red
# team reads rather than a rename; `freeze_plan` was v1's name for `finalize_plan`, but the
# *meaning* moved with it — v1 froze the plan permanently and v2 reopens a finalized plan
# through a recorded revision, so package 8's prose was rewritten rather than renamed, and
# the package with it, since the glossary calls the moment finalization. `export_plan` was
# the only one with nothing behind it: rendering had been scoped out of the build, and a
# read-only render was added for it (DEVIATIONS D21). The red-team script had a second,
# quieter version of the same hole — it is shipped here and nothing served it, so
# `get_auxiliary` was exposed.
#
# **The stamp is the point of this file.** It identified itself as rev 2 until 2026-07-22
# — revision and stamp both copied along with the content they exist to distinguish, so
# every caller asking which methodology was in force got the wrong answer, and
# requirements:71's migration path had no way to tell one revision from the other
# (DEFECTS.md F31). Change the stamp whenever the content changes.

# Two steps were added to the architecture package on 2026-07-22, and they are additions
# rather than vendored content because v2's own decisions created the obligation: D13 makes
# package membership mandatory and finalization refuses an unpackaged task, and D12 freezes
# a contract's obligation surface at finalization. Both are enforced by the tool and neither
# was asked for anywhere a planner would read. A rule with nothing leading anyone to satisfy
# it is how `finalize_plan` came to refuse every plan authored through the surface (F39).

revision: 3
revision_stamp: "plantool-rev3-2026-07-23a"
vendored_from: "PlanTool v1 (archive/v1/server/prompts/)"
mandate: mandate.md

# The other content assets requirements:71 names. Both are loaded unconditionally by
# engine/methodology/__init__.py; listed here so a revision is inspectable as a set.
gap_rules: gap_rules.yaml
gate_criteria: gate_criteria.yaml

# Mode governs who is the source of truth, and therefore how the interview runs
# (mandate clause 2). Elicit packages carry mandatory divergence rounds
# (requirements:16, decisions:36).
packages:
  - number: 1
    name: "Context & goals"
    mode: elicit
    script: package1_context.md
    tables: [decisions, requirements, entities]
  - number: 2
    name: "Use cases"
    mode: elicit
    script: package2_use_cases.md
    tables: [use_cases, uc_steps, uc_extensions]
  - number: 3
    name: "Requirements"
    mode: elicit
    script: package3_requirements.md
    tables: [requirements]
  - number: 4
    name: "Domain model"
    mode: synthesize
    script: package4_domain.md
    tables: [entities, crud_grid, state_machines, sm_cells]
  - number: 5
    name: "External dependencies & failure modes"
    mode: synthesize
    script: package5_errors_deps.md
    tables: [dependencies, dep_failure_modes]
  - number: 6
    name: "Architecture"
    mode: synthesize
    script: package6_architecture.md
    tables: [components, contracts]
  - number: 7
    name: "Adversarial findings"
    mode: verify
    script: package7_adversarial.md
    tables: [findings]
  - number: 8
    name: "Finalization"
    mode: verify
    script: package8_finalization.md
    tables: []

# Containment: child row type -> its mandatory owning parent row type.
#
# In v1 each of these was a NOT NULL foreign key and the database refused an orphan. The
# package-6 flattening into generic `plan_rows`/`links` preserved every row and dropped
# every relation; F20 (`contract_deps`) and F24 (`contracts.component_id`) were the two
# found by accident. The M6 sweep of v1's schema found six more, listed here.
#
# This lives in the methodology and not in the engine on purpose. These row types belong
# to *this* methodology — an engine that knows `uc_steps` has started to contain a
# methodology of its own, which is findings:4. The engine enforces whatever a revision
# declares here and knows none of these names.
#
# Enforced at submission by row-service as a single `belongs_to` edge, so an orphan is
# rejected at the moment of writing rather than surfaced as a gate warning later. This is
# well-formedness, not judgment: the row is meaningless without its parent, the same
# reason provenance is mandatory. It is not a gate advisory and D7's warn-don't-block
# stance is untouched.
containment:
  uc_steps: use_cases
  uc_extensions: uc_steps
  crud_grid: entities
  state_machines: entities
  sm_cells: state_machines
  dep_failure_modes: dependencies

# Served alongside the package script when a red-team session opens (use_cases:8).
auxiliary:
  redteam: redteam.md
