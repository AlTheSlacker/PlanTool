# Gap-derivation rules — a content asset (requirements:71).
#
# v1 expressed these as hand-written SQL per stage, against a schema with one table per
# row type. v2's generic PlanRow store lets the same deficiencies be stated
# declaratively, so the methodology is versioned data rather than code and can be
# revised without a release.
#
# Priority order is vendored from v1 (archive/v1/engine/gaps.py):
#   1  open conflicts            (conflict-service, M3)
#   2  holes in the current stage
#   3  assumed + world  -> resolve by spike, never by asking the owner
#   4  assumed + intent -> resolve by asking the owner, never by spiking
#   5  open questions
#   6  advance the stage
#
# Rule types:
#   empty_table      no live rows in `table`
#   missing_field    live rows in `table` whose content lacks any of `fields`
#   untraced         live rows in `table` with no `direction` link to any row in
#                    `to_table`; `unless_field` exempts rows that explain the absence
#   open_assumption  live assumed rows, filtered by `assumption_kind`
#   uncited_section  a stored source has sections no extract has ever drawn from
#   unreasoned       live rows in `table` missing any of the named justification
#                    *columns* — `grounds` and `alternatives`, which are real columns and
#                    not content keys. It has no `unless_field`: `dismiss_gap` is the
#                    exemption route, and it is recorded where the owner can read it

rules:
  # --- stage 1: context & goals (elicit) ---
  - id: stage1_not_started
    priority: 2
    stage: 1
    # `goals`, not `decisions`. v1 recorded goals as decisions prefixed "Goal:" and this
    # rule was vendored with that shape; v2's gate criteria give goals, non-goals and
    # stack their own tables, so the rule was testing a table stage 1 no longer fills.
    # It fired "nothing recorded yet" at a complete, passing stage 1 until M3's
    # end-to-end drive caught it (DEFECTS.md F11).
    type: empty_table
    table: goals
    ask: >-
      Nothing recorded yet. Open the stage-1 interview: problem, users, goals with
      success criteria, non-goals, constraints, and target stack. Run the divergence
      round first — owner-generated candidates before you draft anything.

  - id: goal_without_success_criteria
    priority: 2
    stage: 1
    type: missing_field
    table: goals
    fields: [success_criteria]
    ask: >-
      Goal "{name}" has no success criteria. A goal you cannot measure cannot be
      gated. Propose a criterion with a scale and a target, and ask for objection.

  # --- stage 2: use cases (elicit) ---
  - id: no_use_cases
    priority: 2
    stage: 2
    type: empty_table
    table: use_cases
    ask: >-
      No use cases yet. Run the divergence round BEFORE drafting: ask the owner to name
      the scenarios already in their head, then probe the negative space (which stage-1
      actor has no scenario? what must the system refuse to do?). Only then draft, and
      mark your additions assumed/intent.

  - id: step_without_extensions
    priority: 2
    stage: 2
    type: untraced
    table: uc_steps
    to_table: uc_extensions
    direction: in
    unless_field: no_extension_reason
    ask: >-
      Step "{name}" has no extensions and no no_extension_reason. What can fail or vary
      here? Propose the handling rather than asking a blank question. If genuinely
      nothing can vary, record why.

  - id: actor_without_use_case
    priority: 2
    stage: 2
    type: untraced
    table: actors
    to_table: use_cases
    direction: in
    ask: >-
      Actor "{name}" appears in no use case. Either they have a scenario nobody has
      elicited, or they should not be recorded as an actor. This is the negative-space
      probe the divergence round exists for.

  # --- stage 3: requirements (elicit) ---
  - id: no_requirements
    priority: 2
    stage: 3
    type: empty_table
    table: requirements
    ask: >-
      No requirements yet. Derive EARS-typed requirements from the use cases and link
      each to what it came from; quantify NFRs with Planguage (scale/meter/target).

  - id: use_case_untraced
    priority: 2
    stage: 3
    type: untraced
    table: use_cases
    to_table: requirements
    direction: in
    ask: >-
      Use case "{name}" traces to no requirement. Derive its requirements and link
      them, or record why it needs none.

  - id: nfr_unquantified
    priority: 2
    stage: 3
    type: missing_field
    table: requirements
    fields: [planguage_scale, planguage_meter, planguage_target]
    when_field: is_nfr
    ask: >-
      NFR "{name}" lacks a full Planguage triad (scale/meter/target). An unquantified
      NFR cannot be verified and will not survive a gate.

  # --- stage 4: domain model (synthesize) ---
  - id: no_entities
    priority: 2
    stage: 4
    type: empty_table
    table: entities
    ask: >-
      No domain entities yet. Synthesize mode: you are the source. Propose the domain
      model with lifecycle judgments and your reasoning, and let the owner adjudicate.

  - id: entity_without_crud
    priority: 2
    stage: 4
    type: untraced
    table: entities
    to_table: crud_grid
    direction: in
    ask: >-
      Entity "{name}" has no CRUD grid. Propose the responsible actor or component per
      operation, or an explicit n/a with a reason — and note children-on-delete for D.

  - id: lifecycle_without_state_machine
    priority: 2
    stage: 4
    type: untraced
    table: entities
    to_table: state_machines
    direction: in
    when_field: has_lifecycle
    ask: >-
      Entity "{name}" is marked as having a lifecycle but has no state machine. Propose
      the states and events, including the impossible transitions and why they are
      impossible.

  # The decision-context rules (v3 D11), one per synthesize-stage table whose rows are
  # design decisions. Every stage here is the one `manifest.yaml` assigns the table, so
  # the gap fires where the planner can act on it.
  #
  # The elicit stages have none, and that is a rule rather than an oversight: stages 1, 2
  # and 3 record what the owner said, and what the owner said is not a decision the tool
  # needs defended. Grid cells have none either — 187 `sm_cells` rows do not each carry an
  # argument, the state machine does, and the containment map already names each cell's
  # mandatory parent.
  - id: entity_without_grounds
    priority: 2
    stage: 4
    type: unreasoned
    table: entities
    fields: [grounds, alternatives]
    ask: >-
      "{name}" records no {missing}. A design decision nobody can defend is one a later
      session will reopen. Write why this shape was chosen and what you considered
      instead — "none, it follows from X" is a complete answer when it is true. Call
      record_grounds().

  - id: state_machine_without_grounds
    priority: 2
    stage: 4
    type: unreasoned
    table: state_machines
    fields: [grounds, alternatives]
    ask: >-
      "{name}" records no {missing}. A design decision nobody can defend is one a later
      session will reopen. Write why this shape was chosen and what you considered
      instead — "none, it follows from X" is a complete answer when it is true. Call
      record_grounds().

  # --- stage 5: dependencies (synthesize) ---
  - id: no_dependencies
    priority: 2
    stage: 5
    type: empty_table
    table: dependencies
    ask: >-
      No external dependencies recorded. Every filesystem, service, API and external
      agent the system touches is a dependency with failure modes worth designing for.

  - id: dependency_without_failure_modes
    priority: 2
    stage: 5
    type: untraced
    table: dependencies
    to_table: dep_failure_modes
    direction: in
    ask: >-
      Dependency "{name}" has no recorded failure modes. What does the system do when
      it is slow, unavailable, malformed, or partial? Propose the handling.

  - id: dependency_without_grounds
    priority: 2
    stage: 5
    type: unreasoned
    table: dependencies
    fields: [grounds, alternatives]
    ask: >-
      "{name}" records no {missing}. A design decision nobody can defend is one a later
      session will reopen. Write why this shape was chosen and what you considered
      instead — "none, it follows from X" is a complete answer when it is true. Call
      record_grounds().

  # --- stage 6: architecture (synthesize) ---
  - id: no_components
    priority: 2
    stage: 6
    type: empty_table
    table: components
    ask: >-
      No components yet. Propose the architecture shape with your reasoning — and name what
      will consume each component other than the surface you are building now.

  - id: component_without_contracts
    priority: 2
    stage: 6
    type: untraced
    table: components
    to_table: contracts
    direction: in
    ask: >-
      Component "{name}" has no contracts. Define its functions with parameters,
      returns and errors — and give every error a stated trigger.

  - id: component_without_grounds
    priority: 2
    stage: 6
    type: unreasoned
    table: components
    fields: [grounds, alternatives]
    ask: >-
      "{name}" records no {missing}. A design decision nobody can defend is one a later
      session will reopen. Write why this shape was chosen and what you considered
      instead — "none, it follows from X" is a complete answer when it is true. Call
      record_grounds().

  - id: contract_without_grounds
    priority: 2
    stage: 6
    type: unreasoned
    table: contracts
    fields: [grounds, alternatives]
    ask: >-
      "{name}" records no {missing}. A design decision nobody can defend is one a later
      session will reopen. Write why this shape was chosen and what you considered
      instead — "none, it follows from X" is a complete answer when it is true. Call
      record_grounds().

  # --- provenance rules: any stage ---
  - id: world_assumption_open
    priority: 3
    stage: null
    type: open_assumption
    assumption_kind: world
    ask: >-
      Assumed fact about external reality: "{name}". A world-assumption is resolved by
      a spike against the real dependency, never by asking the owner. Register the
      spike, or supersede the row if it is no longer load-bearing.

  - id: intent_assumption_open
    priority: 4
    stage: null
    type: open_assumption
    assumption_kind: intent
    ask: >-
      Assumed intent: "{name}". Only the owner can resolve this. Put it to them and
      quote their answer back into the row — do not spike it and do not let it stand.

  # --- references ---
  - id: source_section_uncited
    priority: 4
    stage: null
    type: uncited_section
    # Sections that carry no unique claims. Abstract is included deliberately: it
    # restates findings that appear in full elsewhere, so flagging it is noise, and a
    # meter that cries wolf stops being read.
    ignore_headings:
      - Abstract
      - References
      - Bibliography
      - Acknowledgements
      - Acknowledgments
      - (front matter)
      - (whole document)
    ask: >-
      Source "{name}" has never been read from its {heading} section. Limitations,
      threats to validity and negative results are where a study's caveats live — a
      paper cited only from its Results is a paper half read.

  # --- vocabulary (D23) ---
  #
  # Two rules stood here — `no_glossary`, which asked once whether the plan had agreed the
  # meaning of any word, and `unsettled_term`, which asked the owner to settle each
  # definition the planner had proposed. **Both were removed on 2026-08-03 by v3 change 4**,
  # on the owner's instruction: "forget you prompting the user, it's another friction
  # point", and "plan_status reporting of glossary is pointless".
  #
  # They are removed from this asset and not only from the newest revision, and that is
  # forced rather than tidy. `gaps.py` no longer implements either rule *type*, so a plan
  # loading this revision would raise on the first derive; and `unsettled_term`'s ask named
  # `approve_term`, which the registry can no longer resolve, so the door would refuse to
  # serve it. An asset that cannot be loaded and an instruction to call a tool that does not
  # exist are both worse than the absence. `revision_stamp` moves with the content, which is
  # F31's rule stated in this revision's own manifest.
  #
  # What replaced them is not another rule. The glossary is now loaded into the session at
  # its start, so the words are in front of the writer at the moment of naming — and the
  # planner still names the words that carried weight (mandate clause 7), which is a
  # judgment and was never a rule's to make.
